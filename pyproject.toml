[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-surface-recon"
version = "0.1.0"
description = "A Python-based attack surface reconnaissance pipeline for authorized external asset discovery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Your Name" }
]
keywords = ["security", "reconnaissance", "attack-surface", "python", "osint"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Information Technology",
  "Topic :: Security"
]

dependencies = [
  "httpx>=0.27.0",
  "dnspython>=2.6.1",
  "sqlalchemy>=2.0.32",
  "pydantic>=2.8.2",
  "typer>=0.12.3",
  "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.2",
  "black>=24.8.0",
  "mypy>=1.11.1"
]

[project.scripts]
recon-pipeline = "recon_pipeline.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"